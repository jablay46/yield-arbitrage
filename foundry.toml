[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
# Base mainnet (and the Aave V3 Pool on recent blocks) uses EVM opcodes that
# are only active from Prague. Pin the version so fork tests don't hit
# `NotActivated` halts on the Aave flashloan path.
evm_version = "prague"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
baseSepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}" }

# Interface files deliberately group related interfaces in one file, and
# tests use literals liberally. Both noisy rules are disabled here; the few
# intentional patterns elsewhere use inline forge-lint directives.
[lint]
exclude_lints = ["literal-instead-of-constant", "multi-contract-file"]

[profile.ci]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 10000
via_ir = true
evm_version = "prague"
