name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show forge version
        run: forge --version

      - name: Compile
        run: forge build

      # Fork tests default to the public Base RPC (https://mainnet.base.org)
      # when BASE_RPC_URL is unset/empty; set the repo secret for rate-limit
      # headroom. We only export it when the secret exists so the test's
      # envOr fallback still works when the secret is absent (an empty
      # string would otherwise override the fallback).
      - name: Run tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          if [ -z "$BASE_RPC_URL" ]; then
            echo "BASE_RPC_URL secret not set; tests will use the public Base RPC fallback."
            unset BASE_RPC_URL
          fi
          forge test

  bot:
    name: Bot (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test
